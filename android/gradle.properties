# Project-wide Gradle settings.

# IDE / global overrides:
# If hs_err_pid*.log shows -Xmx1536m and G1 while this file says 768m, something else WINS:
# - Android Studio: Settings → Build Tools → Gradle → Gradle JDK / VM options (clear custom VM options).
# - User file: %USERPROFILE%\.gradle\gradle.properties — delete org.gradle.jvmargs there if present.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Daemon on: D8/R8 (mergeExtDexDebug) needs a large *Java* heap; 1g caused heap OOM during dex merge.
# Worker daemons inherit org.gradle.jvmargs — keep Xmx modest on 16GB RAM (2 JVMs ≈ 2× this value).
# Close Android Studio / other Gradle clients while building if you still hit native OOM.
org.gradle.daemon=true

org.gradle.jvmargs=-Xmx2048m -Xms256m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.vfs.watch=false

# Run Kotlin in the Gradle daemon instead of a separate Kotlin daemon JVM (~512MB–1GB saved).
kotlin.compiler.execution.strategy=in-process

# Fewer parallel NDK/clang jobs (helps on 16GB RAM Windows builds).
android.ndkParallelism=1

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
# Single ABI = much less native / CMake RAM during debug builds (typical phones: arm64).
# Emulator (x86_64): set reactNativeArchitectures=x86_64 for that session.
reactNativeArchitectures=arm64-v8a

# Required by react-native-reanimated 4+ (assertNewArchitectureEnabledTask). Keep single ABI + low RAM elsewhere.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Bind the Gradle lock listener to localhost to avoid "Address already in use" errors
org.gradle.internal.locklistener.address=127.0.0.1

# Unused when kotlin.compiler.execution.strategy=in-process (see above).
# kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m

# vision-camera: frame processors pull extra native deps; off unless you use them.
VisionCamera_enableFrameProcessors=false

# Fewer file watchers on Windows (can save native handles / memory).
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
android.enableJetifier=true
